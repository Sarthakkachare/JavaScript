<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    /* background-color: #f0f0f0; */
}

.container {
    text-align: center;
}

#season-select {
    padding: 10px;
    margin-bottom: 20px;
}

button {
    padding: 10px 20px;
    margin-bottom: 20px;
    cursor: pointer;
}

.info-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100px;
    width: 300px;
    border: 1px solid #ccc;
    background-color: #fff;
    padding: 20px;
}

#season-info {
    font-size: 16px;
    color: #333;
}

    </style>
</head>
<body>
    <div class="container">
        <select id="season-select">
            <option value="">Select a season</option>
            <option value="summer">Summer</option>
            <option value="winter">Winter</option>
            <option value="rainy">Rainy</option>
        </select>
        <button onclick="displayImage()">Show Image</button>
        <div class="image-container">
            <p id="para"></p>
            <img id="season-image" src="" alt="Season Image">
        </div>
    </div>
    <script>
        function displayImage() {
    const selectElement = document.getElementById('season-select');
    const imageElement = document.getElementById('season-image');
    const paraElement = document.getElementById('para');
    const season = selectElement.value;

    switch (season) {
        case 'summer':
            paraElement.textContent="Summer Season";
            paraElement.style.color='red';
            imageElement.src = 'https://th.bing.com/th?id=OIP.nlllQWOVoL9kQFnNf6ecewHaEo&w=316&h=197&c=8&rs=1&qlt=90&o=6&dpr=1.3&pid=3.1&rm=2';
            // imageElement.alt = 'Summer Image';
            break;
        case 'winter':
        paraElement.textContent="Winter season";
        paraElement.style.color='green';
            imageElement.src = 'https://th.bing.com/th/id/OIP.Bqd0wB0dZX4OqCtnxOYbtQHaE7?rs=1&pid=ImgDetMain';
            // imageElement.alt = 'Winter Image';
            break;
        case 'rainy':
        paraElement.textContent="Rainy Season";
        paraElement.style.color='voilet';
            imageElement.src = 'https://th.bing.com/th/id/OIP.puXJFU7sgQYK7ae12BnZbQHaEK?rs=1&pid=ImgDetMain';
            // imageElement.alt = 'Rainy Image';
            break;
        default:
            // imageElement.src = '';
            // imageElement.alt = 'Season Image';
    }
}

    </script>
</body>
</html>
