<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Javascript Events</h1>
    <p id="cursor" onkeydown="Hover()">Keep cursor on me</p>
    <input type="text" onfocus="Focus()" id="box">
</body>
<script>
    function Hover(){
        alert('this is alert');
    }
    function Focus(){
        document.getElementById('box').style.background='aqua';
    }
</script>
</html>
