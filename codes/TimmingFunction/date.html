<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            height: 100px;
            width: 200px;
            /* margin-bottom: 10px; */
            background-color: burlywood;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: chocolate;
            margin-left: 5px;
            border: 2px solid black;
            border-radius: 10px;
        }

        h1{
            width: 200px;
            background-color: cadetblue;
            display: flex;
            justify-content: center;
            align-items: center;
            color: chocolate;
            margin-left: 5px;
            border: 2px solid black;
            border-radius: 10px;
        }
        .container{
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: thistle;
            width: 900px;
            height: 300px;
            border: 2px solid black;
            border-radius: 10px;    
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="indiadel">
            <h1>INDIA</h1>
            <div class="india box" id="indianTime"></div>
        </div>
        <div class="newyorkdel">
            <h1>NEW YORK</h1>
            <div class="newyork box" id="newYorkTime"></div>
        </div>
        <div class="parisdel">
            <h1>PARIS</h1>
            <div class="paris box" id="parisTime"></div>
        </div>
        <div class="candadel">
            <h1>CANADA</h1>
            <div class="canda box" id="candaTime"></div>
        </div>
    </div>
</body>
<script src="date.js"></script>

</html>
