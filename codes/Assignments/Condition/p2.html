<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>if else</h1>
    <p>A time based greeting</p>
    <p id="id"></p>
</body>
<script>
    const hour = new Date().getTime     ();
    document.write(hour);
    let greeting;
    if(hour < 18){
        greeting = 'Good day';
    }else{
        greeting = 'Good evening';
    }
    document.getElementById('id').innerHTML = greeting;
</script>
</html>
