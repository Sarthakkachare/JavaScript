<body>
    <script>
        function arrObj(arr){
            let obj={};

            arr.forEach((v)=>{
                let key = v[0];
                let value = v[1];
                obj[key] = value;
            });
            // document.write(obj);
            for(s of obj){
                document.write(s);
            }
            return obj;
        }
       console.log(arrObj([['ram','developer'],['sham','Tester'],['yam','Anyalist']]));
    </script>
